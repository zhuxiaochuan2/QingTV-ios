name: build-ipa

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（关签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project QingTV.xcodeproj \
            -scheme QingTV \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcpretty || xcodebuild -project QingTV.xcodeproj -scheme QingTV -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: 打成 ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/QingTV.app Payload/
          zip -qry QingTV.ipa Payload
          ls -lh QingTV.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: QingTV-ipa
          path: QingTV.ipa
